name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Requires Node 22.5.0+ for native node:sqlite (DatabaseSync)
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend || npm install --prefix frontend

      - name: Install Backend Dependencies
        run: npm ci --prefix backend || npm install --prefix backend

      - name: Run Frontend Automated Tests
        run: npm test --prefix frontend -- --run

      - name: Run Backend Automated Tests
        env:
          GROQ_API_KEY: mock-ci-key
          HINDSIGHT_API_KEY: mock-ci-key
          NODE_ENV: test
        run: npm test --prefix backend

      - name: Build Frontend Production Bundle
        run: npm run build --prefix frontend

      - name: Security Check - Verify No Tracked Secrets
        run: |
          echo "Verifying no private .env files or database files are committed..."
          ! git ls-files | grep -E '(\.env$|\.env\.local|\.sqlite|\.sqlite-wal|\.sqlite-shm)'
